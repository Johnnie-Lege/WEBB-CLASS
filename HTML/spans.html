<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form.</title>
</head>
<body>


    <form action="#" method="post">
        <caption id="regi"><b>Fill the Registration Form.</b></caption><br><br>
        <table cellpadding="8px">
            <tr>
                <td>
                    <label for="fullname"> Fullname:</label>
                </td>
                <td>
                    <input type="text" name="fullname" >
                </td>
            </tr>
            <tr>
                <td>
                    <label for="gender">Gender:</label>
                </td>
                <td>
                    <label for="male" name="gender">Male</label>
                    <input type="radio" name="gender" value="male">
                    <label for="female" name="gender">Female</label>
                    <input type="radio" name="gender" value="female">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="dob">D.O.B:</label>
                </td>
                <td>
                    <input type="date" name="dob">
                </td>
            </tr>
            <tr>
                <td><label for="nationality">Nationality:</label></td>
                <td>
                    <select name="nationality" >
                        <option value="Ugandan">Ugandan</option>
                        <option value="Kenyan">Kenyan</option>
                        <option value="Ugandan">Ugandan</option>
                        <option value="Ugandan">Ugandan</option>
                        <option value="Ugandan">Ugandan</option>
                        <option value="Ugandan">Ugandan</option>
                        <option value="Ugandan">Ugandan</option>
                        <option value="Ugandan">Ugandan</option>
                        <option value="Ugandan">Ugandan</option>
                        <option value="Ugandan">Ugandan</option>
                        <option value="Ugandan">Ugandan</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="email">Email Address:</label>
                </td>
                <td>
                    <input type="email" name="email" placeholder="xzy@abc.fg">
                </td>
            </tr>

            <tr>

                <td>
                    <label for="marrital">Marrital Status:</label>
                </td>

                <td>
                    <label for="married">Married</label>
                    <input type="radio" name="marrital" valu="married">
                    <label for="single">Single</label>
                    <input type="radio" name="marrital" valu="single">
                    <label for="married">Divorced</label>
                    <input type="radio" name="marrital" valu="divorced">
                </td>
            </tr>
            <tr>
                <td><label for="kin">Next of keen:</label></td>
                <td><input type="text" name="kin" ></td>
            </tr>
            <tr>
                <td><label for="relationship">Relationship with 
                    <br> next of keen:</label></td>
                    <td>
                        <select name="relationship">

                            <option value="brother">Brother</option>
                            <option value="sister">Sister</option>
                            <option value="Nephew">Nephew</option>
                            <option value="Causin">Causin</option>
                            <option value="other">Other</option>
                           
                        </select>
                    </td>
            </tr>
            <tr>
                <td><label for="district">Home District:</label></td>
                <td><input type="text" name="district"></td>
            </tr>
            <tr>
                <td><label for="number">Phone Number:</label></td>
                <td><input type="tel" name="number"></td>
            </tr>

            <tr>

                <td>
                    <label for="employment">Emploment Status:</label>
                </td>

                <td>
                    <label for="employed">Employed</label>
                    <input type="radio" name="employment" valu="Employed">
                    <label for="Unemployed">Unemployed</label>
                    <input type="radio" name="employment" valu="Unemployed">
                    
                </td>
            </tr>
            <tr>
                <td><label for="Occupation:">Occupation:</label></td>
                <td><input type="text" name="Occupation:"></td>
            </tr>
            <tr>

                <td>
                    <label for="Guardian">Guardian Alive:</label>
                </td>

                <td>
                    <label for="father">Father</label>
                    <input type="checkbox" name="Guardian" valu="father">
                    <label for="mother">Mother</label>
                    <input type="checkbox" name="Guardian" valu="mother">
                    <label for="other">Other</label>
                    <input type="checkbox" name="Guardian" valu="other">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="description">Describe yourself:</label>
                </td>
                <td>
                    <textarea name="description" 
                    placeholder="Tell us about yourself." ></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <button type="submit">Submit Form</button>
                </td>
                <td>
                    
                        <a href="#logg">Have an Account?</a>
                  
                </td>
            </tr>




        </table>

        




    </form> <br><br><br><br><br><br><br><br><br> <br><br><br><br><br><br>

 <br><br><br><br><br><br> <br><br><br><br><br><br>

    <form action="#" method="post">
        <br> <br>
        <caption id="logg"><b>Login Page.</b></caption>

        <table cellpadding="12px">

            <tr>
                <td>
                    <label for="Username">Username:</label>
                </td>
                <td>
                    <input type="text" name="Username" id="">
                </td>
            </tr>

             <tr>
                <td>
                    <label for="Password">Password:</label>
                </td>
                <td>
                    <input type="password" name="Password" id="">
                </td>
            </tr>
            <tr>

                <td>
                    <button type="submit">Login</button>
                </td>
                <td>
                    <button>
                        <a href="#regi">Register</a>
                    </button>
                </td>
            </tr>
        </table>
    </form>
    <br><br><br><br><br><br>
    
</body>
</html>
